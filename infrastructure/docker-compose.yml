services:
  n8n:
    build:
      context: .
      dockerfile: Dockerfile.n8n
    container_name: n8n-enterprise-core
    restart: always
    ports:
      - "127.0.0.1:${port}:${port}"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    env_file:
      - .env
    environment:
      - N8N_LOG_LEVEL=info
      - N8N_LOG_OUTPUT=console,file
      - N8N_LOG_FILE_LOCATION=/home/node/.n8n/logs/n8n.log
      - N8N_LOG_FILE_SIZE_MAX=50
      - N8N_LOG_FILE_COUNT_MAX=10
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=336
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      - N8N_EXPRESS_TRUST_PROXY=loopback,linklocal,unicast
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_HOST=${SUBDOMAIN}.${DOMAIN_NAME}
      - N8N_PORT=${port}
      - N8N_PROTOCOL=https
      - N8N_RUNNERS_ENABLED=false
      - NODE_ENV=production
      - WEBHOOK_URL=https://${SUBDOMAIN}.${DOMAIN_NAME}/
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - TZ=${GENERIC_TIMEZONE}
      - N8N_EDITOR_BASE_URL=https://${SUBDOMAIN}.${DOMAIN_NAME}
      - N8N_FORCE_HTTPS=true
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres # Se resuelve por DNS interno de Docker
      - DB_POSTGRESDB_PORT=${port_db}
      - DB_POSTGRESDB_DATABASE=${n8n_db}
      - DB_POSTGRESDB_USER=${n8n_user}
      - DB_POSTGRESDB_PASSWORD=${n8n_pass}
      - NODE_FUNCTION_ALLOW_EXTERNAL=jsonwebtoken,pdf-parse
      - NODE_FUNCTION_ALLOW_BUILTIN=crypto,fs
      - N8N_COMMUNITY_PACKAGES_ALLOW_TOOL_USAGE=true
      - JWT_SECRET=${JWT_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_API_KEY_IMMS=${OPENAI_API_KEY_IMMS}
      - N8N_GIT_NODE_DISABLE_BARE_REPOS=true
      - SERVICES_TIMEOUT=300
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - N8N_BLOCK_ENV_VARS_INCLUDE=INTERNAL_SECRET
      - N8N_BLOCK_EXTERNAL_STORAGE_FUNCTIONS=true
      - N8N_CUSTOM_EXTENSIONS=/tmp/n8n-empty-$(date +%s)
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
    depends_on:
      - postgres
    volumes:
      - /opt/n8n/data/n8n_data:/home/node/.n8n
      - ${PROJECT_ROOT}/local-files:/files
      - ${PROJECT_ROOT}/custom:/home/node/.n8n/custom
      - ${LOGS_PATH}:/home/node/.n8n/logs
      - /var/lib/psa/dumps:/var/lib/psa/dumps
      - ./.env:/home/node/.env
    networks:
      - n8n_enterprise_net
    deploy:
      resources:
        limits:
          memory: 1024m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: ankane/pgvector:latest
    container_name: n8n-enterprise-db
    restart: always
    environment:
      - POSTGRES_DB=${n8n_db}
      - POSTGRES_USER=${n8n_user}
      - POSTGRES_PASSWORD=${n8n_pass}
    volumes:
      - /opt/n8n/data/postgres_db_backup:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d
    # ELIMINADO: ports: - "${port_db}:${port_db}" (Seguridad Crítica)
    expose:
      - "${port_db}" # Permite tráfico solo dentro de n8n_enterprise_net
    networks:
      - n8n_enterprise_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  jwt-service:
    build:
      context: ../microservices/jwt-service
      dockerfile: Dockerfile
    container_name: n8n-jwt-service
    restart: always
    # ELIMINADO: ports expuestos al mundo.
    expose:
      - "${port_jwt}"
    env_file:
      - .env
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - N8N_CORS_ALLOW_HEADERS=Authorization,Content-Type
      - N8N_CORS_ORIGINS=https://hosting3m.com,https://cattle.hosting3m.com
    volumes:
      - ../microservices/jwt-service/index.js:/usr/src/app/index.js # Monta solo el archivo JS
      - ../microservices/jwt-service/package.json:/usr/src/app/package.json # Monta el package.json
    networks:
      - n8n_enterprise_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  scraper-service:
    build:
      context: ../microservices/scraper-service
      dockerfile: Dockerfile
    container_name: n8n-scraper-service
    restart: always
    # ELIMINADO: ports expuestos al mundo.
    expose:
      - "${port_scraper}"
    environment:
      - NODE_ENV=production
      - USER_AGENT="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
      - MAX_CONCURRENCY=2
      - PORT=3001
    networks:
      - n8n_enterprise_net
    # OPTIMIZACIÓN DE RECURSOS PARA EVITAR OOM KILL EN VPS DE 2 VCPU
    shm_size: '512m' # Reducido temporalmente. Si usa Puppeteer, 512m es suficiente para concurrencia baja.
    deploy:
      resources:
        limits:
          memory: 800m # Techo más conservador para evitar colisionar con Plesk y n8n
        reservations:
          memory: 300m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  fea-signer-service:
    build:
      context: ../microservices/fea-signer-service/FeaSignerAPI
      dockerfile: Dockerfile
    container_name: n8n-fea-signer
    restart: always
    environment:
      # Inyección segura de la contraseña en tiempo de ejecución
      - FIEL_PASSWORD=${FIEL_PASSWORD}
      - FIEL_CER_PATH=/app/certs/csd.cer
      - FIEL_KEY_PATH=/app/certs/csd.key
    volumes:
      # Montaje de volumen en modo Read-Only (:ro).
      # El contenedor puede leer las llaves, pero NUNCA modificarlas o borrarlas.
      - ./certs/fea:/app/certs:ro
    networks:
      - n8n_enterprise_net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  n8n_restored_data: {}
  postgres_data: {}
  budibase_data: {}

networks:
  n8n_enterprise_net:
    driver: bridge