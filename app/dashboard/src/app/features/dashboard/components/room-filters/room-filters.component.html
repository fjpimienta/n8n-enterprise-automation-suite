<div class="mb-4">
    <div class="d-flex flex-wrap gap-2 justify-content-center mb-2 px-0">
        @for (option of filterOptions; track option.value) {
        <button type="button" class="btn btn-sm btn-outline-info shadow-sm"
            [class]="currentFilter() === option.value ? option.activeClass : 'btn-outline-secondary'"
            (click)="setFilter(option.value)">
            {{ option.label }}
        </button>
        }
    </div>
    <div class="mb-3">
        <div class="input-icon mb-3 position-relative">
            <span class="input-icon-addon">
                <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="24" height="24" viewBox="0 0 24 24"
                    stroke-width="2" stroke="currentColor" fill="none">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                    <path d="M10 10m-7 0a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" />
                    <path d="M21 21l-6 -6" />
                </svg>
            </span>

            <input type="text" #searchInput class="form-control" placeholder="Buscar habitación (Ej: 105)..."
                [value]="bookingService.searchQuery()" (input)="onSearch($event)">

            @if (bookingService.searchQuery().length > 0) {
            <span class="input-icon-addon end-0 cursor-pointer text-hover-danger pe-2"
                (click)="clearSearch(); searchInput.value = ''" title="Limpiar búsqueda">
                <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="24" height="24" viewBox="0 0 24 24"
                    stroke-width="2" stroke="currentColor" fill="none">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                    <path d="M18 6l-12 12" />
                    <path d="M6 6l12 12" />
                </svg>
            </span>
            }
        </div>
    </div>
    @if (isAdmin()) {
    <div class="d-flex flex-wrap gap-2 justify-content-center mb-2 px-2">
        <div class="d-flex justify-content-center px-0">
            <button (click)="onReservations.emit()" class="btn btn-sm btn-outline-info shadow-sm">
                <svg xmlns="http://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-users me-1" width="24"
                    height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none">
                    <path d="M9 7m-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0" />
                    <path d="M3 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2" />
                    <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                    <path d="M21 21v-2a4 4 0 0 0 -3 -3.85" />
                </svg>
                Reservaciones
            </button>
        </div>
        <div class="d-flex justify-content-center px-0">
            <button (click)="onManageGuests.emit()" class="btn btn-sm btn-outline-info shadow-sm">
                <svg xmlns="http://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-users me-1" width="24"
                    height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none">
                    <path d="M9 7m-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0" />
                    <path d="M3 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2" />
                    <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                    <path d="M21 21v-2a4 4 0 0 0 -3 -3.85" />
                </svg>
                Huesped
            </button>
        </div>
        <div class="d-flex justify-content-center px-0">
            <button (click)="onManageUsers.emit()" class="btn btn-sm btn-outline-info shadow-sm">
                <svg xmlns="http://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-users me-1" width="24"
                    height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none">
                    <path d="M9 7m-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0" />
                    <path d="M3 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2" />
                    <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                    <path d="M21 21v-2a4 4 0 0 0 -3 -3.85" />
                </svg>
                Personal
            </button>
        </div>
    </div>
    }
</div>
