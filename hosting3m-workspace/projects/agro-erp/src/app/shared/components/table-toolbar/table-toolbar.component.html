<div class="card-body border-bottom py-3">
    <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-2">
        @if (pagedTable().searchEnabled) {
        <div class="input-icon" style="max-width: 320px;">
            <span class="input-icon-addon">
                <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="24" height="24" viewBox="0 0 24 24"
                    stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                    <path d="M10 10m-7 0a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" />
                    <path d="M21 21l-6 -6" />
                </svg>
            </span>
            <input type="text" class="form-control form-control-sm" [placeholder]="searchPlaceholder()"
                [value]="pagedTable().searchQuery()" (input)="setSearch($any($event.target).value)">
        </div>
        }

        <div class="d-flex align-items-center gap-2 flex-wrap">
            <ng-content></ng-content>

            @if (onExportCsv()) {
            <button type="button" class="btn btn-sm btn-outline-secondary d-flex align-items-center gap-1"
                (click)="onExportCsv()!()">
                <i class="ti ti-download"></i>
                Exportar CSV
            </button>
            }
        </div>
    </div>
</div>
