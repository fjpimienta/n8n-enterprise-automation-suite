<div class="modal modal-blur fade show"
    style="display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.6);" tabindex="-1"
    aria-modal="true" role="dialog">
    <div class="modal-dialog modal-lg w-100" role="document" style="max-width: 800px;">
        <div class="modal-content shadow-lg border-0">

            <div class="modal-header border-bottom">
                <h5 class="modal-title font-weight-bold">
                    <svg xmlns="http://www.w3.org/2000/svg" class="icon text-primary me-2" width="24" height="24"
                        viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                        <path d="M9 5h-2a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-12a2 2 0 0 0 -2 -2h-2" />
                        <path d="M9 3m0 2a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v0a2 2 0 0 1 -2 2h-2a2 2 0 0 1 -2 -2z" />
                        <path d="M14 11h-2.5a1.5 1.5 0 0 0 0 3h1a1.5 1.5 0 0 1 0 3h-2.5" />
                        <path d="M12 17v1m0 -8v1" />
                    </svg>
                    Registrar Gasto Operativo
                </h5>
                <button type="button" class="btn-close" (click)="onClose.emit()" aria-label="Cerrar"></button>
            </div>

            <form [formGroup]="expenseForm" (ngSubmit)="submit()">
                <div class="modal-body">

                    <div class="row mb-3 align-items-end">
                        <div class="col-md-6">
                            <label class="form-label required">Fecha del Gasto</label>
                            <input type="date" class="form-control" formControlName="expense_date"
                                [class.is-invalid]="expenseForm.get('expense_date')?.invalid && expenseForm.get('expense_date')?.touched">
                        </div>

                        <div class="col-md-6 mt-3 mt-md-0">
                            <label class="form-label required">Categoría</label>
                            <select class="form-select" formControlName="category"
                                [class.is-invalid]="expenseForm.get('category')?.invalid && expenseForm.get('category')?.touched">
                                <option value="" disabled selected>Selecciona una categoría...</option>
                                <option value="ALIMENTACION">Alimentación (Forraje / Concentrado)</option>
                                <option value="MEDICINA">Medicina, Vacunas y Curaciones</option>
                                <option value="SUPLEMENTOS">Suplementos (Sales / Minerales)</option>
                                <option value="MANEJO">Manejo, Operación y Fletes</option>
                            </select>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label class="form-label required">Costo Total (MXN)</label>
                            <div class="input-group">
                                <span class="input-group-text">$</span>
                                <input type="number" step="0.01" class="form-control" formControlName="amount"
                                    placeholder="0.00"
                                    [class.is-invalid]="expenseForm.get('amount')?.invalid && expenseForm.get('amount')?.touched">
                            </div>
                        </div>

                        <div class="col-md-4 mt-3 mt-md-0">
                            <label class="form-label">Cantidad Bruta</label>
                            <input type="number" step="0.01" class="form-control" formControlName="quantity"
                                placeholder="Ej: 1000">
                        </div>

                        <div class="col-md-4 mt-3 mt-md-0">
                            <label class="form-label">Unidad de Medida</label>
                            <select class="form-select" formControlName="unit_measure">
                                <option value="KG">Kilogramos (kg)</option>
                                <option value="TON">Toneladas (t)</option>
                                <option value="LITROS">Litros (L)</option>
                                <option value="DOSIS">Dosis</option>
                                <option value="PZA">Piezas / Unidades</option>
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-12">
                            <label class="form-label">Descripción o Concepto</label>
                            <textarea class="form-control" formControlName="description" rows="2"
                                placeholder="Ej: Compra de 1 tonelada de alimento iniciador para el lote 1 de engorda..."></textarea>
                        </div>
                    </div>

                </div>

                <div class="modal-footer border-top">
                    <button type="button" class="btn btn-link link-secondary me-auto font-weight-bold"
                        (click)="onClose.emit()">Cancelar</button>

                    <button type="submit" class="btn btn-primary font-weight-bold"
                        [disabled]="expenseForm.invalid || isSubmitting()">
                        @if (isSubmitting()) {
                        <span class="spinner-border spinner-border-sm me-2" role="status"></span>
                        Registrando...
                        } @else {
                        <svg xmlns="http://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-device-floppy me-2"
                            width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"
                            fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                            <path d="M6 4h10l4 4v10a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2v-12a2 2 0 0 1 2 -2" />
                            <path d="M12 14m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" />
                            <path d="M14 4l0 4l-6 0l0 -4" />
                        </svg>
                        Guardar Gasto
                        }
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>
