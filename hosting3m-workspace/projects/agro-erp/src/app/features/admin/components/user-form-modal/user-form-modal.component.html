@if (isOpen()) {
<div class="modal-backdrop fade show"></div>
<div class="modal modal-blur fade show d-block" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content shadow-lg border-0">
            <div class="modal-header bg-dark text-white">
                <h5 class="modal-title">
                    <i class="ti ti-user me-2"></i>
                    {{ selectedUser() ? 'Actualizar Ficha de Personal' : 'Alta de Nuevo Personal' }}
                </h5>
                <button type="button" class="btn-close btn-close-white" (click)="onClose.emit()"></button>
            </div>
            <div class="modal-body p-4">
                <div class="row">
                    <div class="col-6 mb-3">
                        <label class="form-label fw-bold">Nombres <span class="text-danger">*</span></label>
                        <input type="text" class="form-control shadow-sm"
                            [ngModel]="userData().names" (ngModelChange)="updateField('names', $event)"
                            placeholder="Ej. Juan Carlos">
                    </div>
                    <div class="col-6 mb-3">
                        <label class="form-label fw-bold">Apellidos</label>
                        <input type="text" class="form-control shadow-sm"
                            [ngModel]="userData().lastname" (ngModelChange)="updateField('lastname', $event)"
                            placeholder="Ej. Hermida">
                    </div>
                </div>
                <div class="row">
                    <div class="col-6 mb-3">
                        <label class="form-label fw-bold">Teléfono (WhatsApp)</label>
                        <input type="tel" class="form-control shadow-sm"
                            [ngModel]="userData().phone" (ngModelChange)="updateField('phone', $event)"
                            placeholder="Ej. 9930000000">
                    </div>
                    <div class="col-6 mb-3">
                        <label class="form-label fw-bold">Rol Operativo <span class="text-danger">*</span></label>
                        <select class="form-select shadow-sm"
                            [ngModel]="userData().role" (ngModelChange)="updateField('role', $event)">
                            <option value="ADMIN">Administrador (Acceso Total)</option>
                            <option value="EDITOR">Operador / Caporal</option>
                            <option value="CUSTOMER">Veterinario / Consultor</option>
                        </select>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Correo Electrónico <span class="text-danger">*</span></label>
                    <input type="email" class="form-control shadow-sm"
                        [ngModel]="userData().email" (ngModelChange)="updateField('email', $event)"
                        [disabled]="selectedUser() !== null" placeholder="correo@racho.com">
                    @if(selectedUser() !== null) {
                    <small class="text-muted">El correo es la llave primaria y no puede ser modificado.</small>
                    }
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Contraseña</label>
                    <input type="password" class="form-control shadow-sm"
                        [ngModel]="userData().password" (ngModelChange)="updateField('password', $event)"
                        placeholder="{{ selectedUser() ? 'Dejar vacío para mantener actual' : 'Asignar contraseña inicial' }}">
                </div>
                @if(selectedUser() !== null) {
                <div class="mb-3">
                    <label class="form-check form-switch">
                        <input class="form-check-input" type="checkbox"
                            [ngModel]="userData().is_active" (ngModelChange)="updateField('is_active', $event)">
                        <span class="form-check-label fw-bold">Cuenta Activa</span>
                    </label>
                </div>
                }
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline-secondary px-4 shadow-sm" (click)="onClose.emit()">
                    Cancelar
                </button>
                <button class="btn btn-success px-4 shadow-sm" (click)="onSave.emit()">
                    <i class="ti ti-device-floppy me-2"></i> Guardar Cambios
                </button>
            </div>
        </div>
    </div>
</div>
}
