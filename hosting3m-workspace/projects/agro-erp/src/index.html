<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>AGRO ERP</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="icon" type="image/x-icon" href="/favicon.ico">

  <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/css/tabler.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">

  <link rel="manifest" href="/assets/manifest.webmanifest">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AGRO ERP">
  <link rel="apple-touch-icon" href="/assets/images/logo_agroerp.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/assets/images/logo_agroerp.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/logo_agroerp.png">

  <style>
    :root {
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: #f4f6fa;
    }
  </style>
</head>

<body data-bs-theme="light"> <app-root></app-root>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/assets/sw.js')
          .then(reg => console.log('AGRO ERP Service Worker ready:', reg.scope))
          .catch(err => console.error('AGRO ERP Service Worker failed:', err));
      });
    }
  </script>
</body>

</html>
