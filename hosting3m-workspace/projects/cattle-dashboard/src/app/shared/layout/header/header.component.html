<header class="navbar navbar-expand-md navbar-light d-print-none shadow-sm">
    <div class="container-xl">
        <button class="navbar-toggler" type="button" (click)="toggleMenu()">
            <span class="navbar-toggler-icon"></span>
        </button>

        <h1 class="navbar-brand navbar-brand-autodark d-none-navbar-horizontal pe-0 pe-md-3">
            {{ tenantService.activeTenant()?.company_name || 'Ganadería Digital' }}
        </h1>

        <div class="navbar-nav flex-row order-md-last ms-auto align-items-center">

            <div class="d-none d-md-flex me-3">
                <a href="javascript:void(0)" class="nav-link px-0 hide-theme-dark" title="Cambiar a tema oscuro"
                    (click)="themeService.toggleTheme()">
                    <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="24" height="24" viewBox="0 0 24 24"
                        stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                        <path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1 -8.313 -12.454z" />
                    </svg>
                </a>
                <a href="javascript:void(0)" class="nav-link px-0 hide-theme-light" title="Cambiar a tema claro"
                    (click)="themeService.toggleTheme()">
                    <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="24" height="24" viewBox="0 0 24 24"
                        stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                        <path d="M12 12m-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0" />
                        <path
                            d="M3 12h1m8 -9v1m8 8h1m-9 8v1m-6.4 -15.4l.7 .7m12.1 -.7l-.7 .7m0 11.4l.7 .7m-12.1 -.7l-.7 .7" />
                    </svg>
                </a>
            </div>

            <div class="nav-item dropdown">
                <a href="#" class="nav-link d-flex lh-1 text-reset p-0" data-bs-toggle="dropdown"
                    aria-label="Abrir menú de usuario">
                    <span class="avatar avatar-sm bg-blue-lt font-weight-bold">{{
                        authService.currentUser()?.name?.charAt(0) || 'U' }}</span>
                    <div class="d-none d-xl-block ps-2">
                        <div class="font-weight-bold">{{ authService.currentUser()?.name || 'Administrador' }}</div>
                        <div class="mt-1 small text-muted text-uppercase">{{ authService.currentUser()?.role || 'Socio
                            Operativo' }}</div>
                    </div>
                </a>

                <div class="dropdown-menu dropdown-menu-end dropdown-menu-arrow">
                    <a href="javascript:void(0)" class="dropdown-item text-danger font-weight-bold" (click)="logout()">
                        <svg xmlns="http://www.w3.org/2000/svg" class="icon me-2 text-danger" width="24" height="24"
                            viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                            <path d="M14 8v-2a2 2 0 0 0 -2 -2h-7a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h7a2 2 0 0 0 2 -2v-2" />
                            <path d="M9 12h12l-3 -3" />
                            <path d="M18 15l3 -3" />
                        </svg>
                        Cerrar Sesión
                    </a>
                </div>
            </div>

        </div>
    </div>
</header>
