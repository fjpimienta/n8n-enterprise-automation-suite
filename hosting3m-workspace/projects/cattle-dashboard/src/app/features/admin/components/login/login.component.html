<div class="position-absolute top-0 end-0 p-3" style="z-index: 100;">
  <button class="btn btn-icon shadow-sm" (click)="themeService.toggleTheme()"
    [class.btn-dark]="themeService.currentTheme() === 'light'"
    [class.btn-light]="themeService.currentTheme() === 'dark'" title="Cambiar tema" style="border-radius: 50px;">
    @if (themeService.currentTheme() === 'dark') {
    <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="24" height="24" viewBox="0 0 24 24" stroke-width="2"
      stroke="currentColor" fill="none">
      <path stroke="none" d="M0 0h24v24H0z" fill="none" />
      <path d="M12 12m-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0" />
      <path d="M3 12h1m8 -9v1m8 8h1m-9 8v1m-6.4 -15.4l.7 .7m12.1 -.7l-.7 .7m0 11.4l.7 .7m-12.1 -.7l-.7 .7" />
    </svg>
    } @else {
    <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="24" height="24" viewBox="0 0 24 24" stroke-width="2"
      stroke="currentColor" fill="none">
      <path stroke="none" d="M0 0h24v24H0z" fill="none" />
      <path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1 -8.313 -12.454z" />
    </svg>
    }
  </button>
</div>

<div class="page page-center">
  <div class="container container-tight py-4">

    <div class="text-center mb-4">
      <div class="avatar avatar-xl rounded bg-transparent">
        <img src="assets/images/logo_cattle.png" alt="Logo Ganadería"
          style="width: 100%; height: 100%; object-fit: contain;">
      </div>
      <h2 class="h2 text-center mt-3 mb-1">Rancho San José</h2>
      <div class="text-muted">Centro de Operaciones Ganaderas</div>
    </div>

    <form class="card card-md shadow-sm border-0" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="card-body">
        <h2 class="card-title text-center mb-4">Acceso Seguro</h2>

        @if (errorMessage()) {
        <div class="alert alert-danger" role="alert">
          <svg xmlns="http://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-alert-circle" width="24"
            height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round"
            stroke-linejoin="round">
            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
            <path d="M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0" />
            <path d="M12 8v4" />
            <path d="M12 16h.01" />
          </svg>
          {{ errorMessage() }}
        </div>
        }

        <div class="mb-3">
          <label class="form-label">Empresa / Sucursal</label>
          <div class="input-group">
            <span class="input-group-text">
              <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="24" height="24" viewBox="0 0 24 24"
                stroke-width="2" stroke="currentColor" fill="none">
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path d="M3 21l18 0" />
                <path d="M5 21v-14l8 -4l8 4v14" />
                <path d="M19 21v-10l-6 -4" />
                <path d="M9 9l0 .01" />
                <path d="M9 12l0 .01" />
                <path d="M9 15l0 .01" />
                <path d="M9 18l0 .01" />
              </svg>
            </span>
            <select class="form-select" formControlName="id_company" [class.is-invalid]="isFieldInvalid('id_company')">
              <option value="" disabled selected>Cargando catálogo...</option>
              @for (company of adminService.companies(); track company.id_company) {
              <option [value]="company.id_company">
                {{ company.company_name }}
              </option>
              }
            </select>
          </div>
          @if (isFieldInvalid('id_company')) {
          <div class="text-danger small mt-1">Debe seleccionar una empresa para continuar.</div>
          }
        </div>

        <div class="mb-3">
          <label class="form-label">Usuario / Email</label>
          <div class="input-icon">
            <span class="input-icon-addon">
              <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="24" height="24" viewBox="0 0 24 24"
                stroke-width="2" stroke="currentColor" fill="none">
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0" />
                <path d="M6 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2" />
              </svg>
            </span>
            <input type="text" formControlName="user" class="form-control" placeholder="Ej. admin"
              [class.is-invalid]="isFieldInvalid('user')">
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label">Contraseña</label>
          <div class="input-group input-group-flat">
            <span class="input-group-text">
              <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="24" height="24" viewBox="0 0 24 24"
                stroke-width="2" stroke="currentColor" fill="none">
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path d="M5 13a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v6a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2v-6z" />
                <path d="M11 16a1 1 0 1 0 2 0a1 1 0 0 0 -2 0" />
                <path d="M8 11v-4a4 4 0 1 1 8 0v4" />
              </svg>
            </span>
            <input [type]="showPassword() ? 'text' : 'password'" formControlName="pass" class="form-control"
              placeholder="••••••••" [class.is-invalid]="isFieldInvalid('pass')">
            <span class="input-group-text">
              <a href="#" class="link-secondary" title="Ver contraseña" (click)="togglePassword($event)">
                @if (showPassword()) {
                <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="24" height="24" viewBox="0 0 24 24"
                  stroke-width="2" stroke="currentColor" fill="none">
                  <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                  <path d="M10.585 10.587a2 2 0 0 0 2.829 2.828" />
                  <path
                    d="M16.681 16.673a8.717 8.717 0 0 1 -4.681 1.327c-3.6 0 -6.6 -2 -9 -6c1.272 -2.12 3.145 -3.594 5.23 -4.381" />
                  <path d="M3 3l18 18" />
                </svg>
                } @else {
                <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="24" height="24" viewBox="0 0 24 24"
                  stroke-width="2" stroke="currentColor" fill="none">
                  <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                  <path d="M10 12a2 2 0 1 0 4 0a2 2 0 0 0 -4 0" />
                  <path d="M21 12c-2.4 4 -5.4 6 -9 6c-3.6 0 -6.6 -2 -9 -6c2.4 -4 5.4 -6 9 -6c3.6 0 6.6 2 9 6" />
                </svg>
                }
              </a>
            </span>
          </div>
        </div>

        <div class="form-footer">
          <button type="submit" class="btn btn-primary w-100" [disabled]="isLoading()">
            @if (isLoading()) {
            <div class="spinner-border spinner-border-sm me-2" role="status"></div>
            Verificando Credenciales...
            } @else {
            Ingresar al Sistema
            }
          </button>
        </div>
      </div>
    </form>

    <div class="text-center mb-4">
      <h2 class="h2 text-center mt-3 mb-1">By Hosting3M Suite</h2>
      <div class="text-muted">Ganadería de Precisión & Control Biológico</div>
    </div>

  </div>
</div>
