<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Hotel San José</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="theme-color" content="#206bc4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AdminHotel">

  <link rel="manifest" href="/manifest.webmanifest">

  <link rel="apple-touch-icon" href="/assets/images/icon-192x192.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/assets/images/icon-192x192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/icon-192x192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/assets/images/icon-192x192.png">

  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/css/tabler.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>

<body>
  <app-root></app-root>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        // Usamos la ruta absoluta '/sw.js'
        // Esto funcionará correctamente una vez que el archivo esté en la raíz
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('PWA Service Worker registrado:', reg.scope))
          .catch(err => console.error('PWA Service Worker falló:', err));
      });
    }
  </script>
</body>

</html>
