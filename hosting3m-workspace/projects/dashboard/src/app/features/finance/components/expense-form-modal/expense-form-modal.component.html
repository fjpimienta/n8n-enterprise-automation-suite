@if (isOpen) {
<div class="modal modal-blur fade show d-block" tabindex="-1" style="background: rgba(0,0,0,0.5)">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content shadow-lg">
      <div class="modal-header bg-danger-lt">
        <h5 class="modal-title text-danger">💸 Registrar Gasto / Salida</h5>
        <button type="button" class="btn-close" (click)="close()"></button>
      </div>

      <div class="modal-body">
        <div class="row g-3">
          <div class="col-12 text-muted small fw-bold mb-1">
            📊 Clasificación del Gasto
          </div>

          <div class="col-6">
            <label class="form-label required">Tipo</label>
            <select class="form-select" [(ngModel)]="expenseData.expense_type">
              <option value="OPEX">📉 Operativo (Gasto)</option>
              <option value="CAPEX">📈 Inversión (Obra)</option>
            </select>
          </div>

          <div class="col-6">
            <label class="form-label required">Fase / Proyecto</label>
            <select class="form-select" [(ngModel)]="expenseData.project_phase">
              <option value="OPERACION">🏨 Operación Diaria</option>
              <option value="FASE_0">⚡ Fase 0 (Infra)</option>
              <option value="FASE_1">🧱 Fase 1 (PB)</option>
              <option value="FASE_2">🚧 Fase 2 (1er Piso Norte)</option>
              <option value="FASE_3">🏗️ Fase 3 (1er Piso Sur)</option>
              <option value="FASE_4">🧱 Fase 4 (2do Piso)</option>
            </select>
          </div>
        
          <div class="col-12">
            <label class="form-label required">Concepto</label>
            <input type="text" class="form-control" [(ngModel)]="expenseData.description"
              placeholder="Ej. Compra de cloro, Taxi, Reparación..." autofocus>
          </div>

          <div class="col-6">
            <label class="form-label required">Monto ($)</label>
            <div class="input-group">
              <span class="input-group-text">$</span>
              <input type="number" class="form-control" [(ngModel)]="expenseData.amount" placeholder="0.00">
            </div>
          </div>

          <div class="col-6">
            <label class="form-label">Fecha</label>
            <input type="date" class="form-control" [(ngModel)]="expenseData.expense_date">
          </div>

          <div class="col-6">
            <label class="form-label">Categoría</label>
            <select class="form-select" [(ngModel)]="expenseData.category">
              @for (cat of categories; track cat) {
              <option [value]="cat">{{ cat }}</option>
              }
            </select>
          </div>

          <div class="col-6">
            <label class="form-label">Método Pago</label>
            <select class="form-select" [(ngModel)]="expenseData.payment_method">
              @for (method of paymentMethods; track method) {
              <option [value]="method">{{ method }}</option>
              }
            </select>
          </div>

          <div class="col-6">
            <label class="form-label">Habitación (opcional)</label>
            @if (isRoomLocked) {
            <input type="text" class="form-control" [value]="'Habitación #' + roomId" disabled>
            } @else {
            <select class="form-select" [ngModel]="expenseData.room_id"
              (ngModelChange)="onRoomSelected($event)">
              <option [ngValue]="null">Sin habitación específica</option>
              @for (room of bookingService.rooms(); track room.id) {
              <option [ngValue]="room.id">Hab. {{ room.room_number }}</option>
              }
            </select>
            }
          </div>

          @if (effectiveRoomId) {
          <div class="col-6">
            <label class="form-label">Ticket de Mantenimiento (opcional)</label>
            @if (loadingTickets()) {
            <div class="form-control-plaintext small text-muted">Cargando tickets...</div>
            } @else {
            <select class="form-select" [(ngModel)]="expenseData.maintenance_ticket_id">
              <option [ngValue]="null">Sin ticket asociado</option>
              @for (ticket of roomTickets(); track ticket.id) {
              <option [ngValue]="ticket.id">
                #{{ ticket.id }} - {{ ticket.issue_type }} ({{ ticket.status }})
                @if (ticket.cost) { · Est: ${{ ticket.cost }} }
              </option>
              }
            </select>
            @if (roomTickets().length === 0) {
            <div class="form-hint">Esta habitación no tiene tickets de mantenimiento.</div>
            }
            }
          </div>
          }

        </div>

      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-link link-secondary" (click)="close()">
          Cancelar
        </button>
        <button type="button" class="btn btn-danger ms-auto" (click)="submit()"
          [disabled]="isSaving() || !expenseData.amount">
          @if (isSaving()) { <span class="spinner-border spinner-border-sm me-2"></span> }
          💾 Registrar Salida
        </button>
      </div>
    </div>
  </div>
</div>
}
