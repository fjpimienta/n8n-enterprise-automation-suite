@if (isOpen()) {
<div class="modal-backdrop fade show"></div>
<div class="modal modal-blur fade show d-block" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content shadow-lg border-0">

            <div class="modal-header">
                <h5 class="modal-title fs-3 fw-bold">
                    <i class="ti" [class.ti-edit]="isEditing()" [class.ti-plus]="!isEditing()"></i>
                    {{ isEditing() ? 'Editar Activo' : 'Nuevo Activo' }}
                </h5>
                <button type="button" class="btn-close" (click)="onClose.emit()"></button>
            </div>

            <div class="modal-body p-4">

                <div class="row g-3 mb-3">
                    <div class="col-12 col-md-8">
                        <label class="form-label required">Nombre del Artículo</label>
                        <input type="text" class="form-control" [(ngModel)]="assetData().name"
                            placeholder="Ej. TV Samsung 50'">
                    </div>
                    <div class="col-12 col-md-4">
                        <label class="form-label">N° Serie / Código</label>
                        <input type="text" class="form-control" [(ngModel)]="assetData().serial_number"
                            placeholder="Opcional">
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-12 col-md-6">
                        <label class="form-label required">Categoría</label>
                        <select class="form-select" [(ngModel)]="assetData().category">
                            <option value="ELECTRONICA">Electrónica</option>
                            <option value="MOBILIARIO">Mobiliario</option>
                            <option value="BLANCOS">Blancos</option>
                            <option value="DECORACION">Decoración</option>
                            <option value="OTRO">Otro</option>
                        </select>
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label required">Estado Actual</label>
                        <select class="form-select" [(ngModel)]="assetData().status">
                            <option value="GOOD">✅ Bueno</option>
                            <option value="DAMAGED">⚠️ Dañado / Reparación</option>
                            <option value="MISSING">❌ Perdido / Robado</option>
                            <option value="DISCARDED">🗑️ Dado de baja</option>
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Ubicación Asignada</label>
                    <div class="input-icon">
                        <span class="input-icon-addon"><i class="ti ti-map-pin"></i></span>
                        <select class="form-select ps-5" [(ngModel)]="assetData().current_room_id">
                            <option [ngValue]="null">-- Sin asignar (Bodega) --</option>
                            @for (room of bookingService.rooms(); track room.id) {
                            <option [value]="room.id">Habitación {{ room.room_number }}</option>
                            }
                        </select>
                    </div>
                </div>

                <div class="row g-3">
                    <div class="col-12 col-md-6">
                        <label class="form-label">Costo Compra</label>
                        <div class="input-icon">
                            <span class="input-icon-addon"><i class="ti ti-currency-dollar"></i></span>
                            <input type="number" class="form-control" [(ngModel)]="assetData().cost" placeholder="0.00">
                        </div>
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label">Fecha Compra</label>
                        <div class="input-icon">
                            <span class="input-icon-addon"><i class="ti ti-calendar"></i></span>
                            <input type="date" class="form-control" [(ngModel)]="assetData().purchase_date">
                        </div>
                    </div>
                </div>

            </div>

            <div class="modal-footer">
                <button class="btn btn-link link-secondary me-auto" (click)="onClose.emit()">Cancelar</button>
                <button class="btn btn-primary" (click)="onSave.emit()" [disabled]="!assetData().name">
                    <i class="ti ti-device-floppy me-2"></i> Guardar Activo
                </button>
            </div>

        </div>
    </div>
</div>
}
