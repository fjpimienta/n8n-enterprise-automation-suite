@if (isOpen()) {
<div class="modal-backdrop fade show"></div>
<div class="modal modal-blur fade show d-block" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content shadow-lg border-0">
            <div class="modal-header bg-dark text-white">
                <h5 class="modal-title">{{ isEditing() ? 'Editar Activo' : 'Nuevo Activo' }}</h5>
                <button type="button" class="btn-close btn-close-white" (click)="onClose.emit()"></button>
            </div>
            <div class="modal-body p-4 bg-light text-dark">

                <div class="row mb-3">
                    <div class="col-8">
                        <label class="form-label fw-bold small">Nombre del Artículo</label>
                        <input type="text" class="form-control shadow-sm" [(ngModel)]="assetData().name"
                            placeholder="Ej. TV Samsung 50'">
                    </div>
                    <div class="col-4">
                        <label class="form-label fw-bold small">N° Serie / Código</label>
                        <input type="text" class="form-control shadow-sm" [(ngModel)]="assetData().serial_number">
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-6">
                        <label class="form-label fw-bold small">Categoría</label>
                        <select class="form-select shadow-sm" [(ngModel)]="assetData().category">
                            <option value="ELECTRONICA">Electrónica</option>
                            <option value="MOBILIARIO">Mobiliario</option>
                            <option value="BLANCOS">Blancos</option>
                            <option value="DECORACION">Decoración</option>
                            <option value="OTRO">Otro</option>
                        </select>
                    </div>
                    <div class="col-6">
                        <label class="form-label fw-bold small">Estado Actual</label>
                        <select class="form-select shadow-sm" [(ngModel)]="assetData().status">
                            <option value="GOOD">✅ Bueno</option>
                            <option value="DAMAGED">⚠️ Dañado / Reparación</option>
                            <option value="MISSING">❌ Perdido / Robado</option>
                            <option value="DISCARDED">🗑️ Dado de baja</option>
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold small">Ubicación Asignada</label>
                    <select class="form-select shadow-sm" [(ngModel)]="assetData().current_room_id">
                        <option [ngValue]="null">-- Sin asignar (Bodega) --</option>
                        @for (room of bookingService.rooms(); track room.id) {
                        <option [value]="room.id">Habitación {{ room.room_number }}</option>
                        }
                    </select>
                </div>

                <div class="row mb-3">
                    <div class="col-6">
                        <label class="form-label fw-bold small">Costo Compra</label>
                        <div class="input-group shadow-sm">
                            <span class="input-group-text">$</span>
                            <input type="number" class="form-control" [(ngModel)]="assetData().cost">
                        </div>
                    </div>
                    <div class="col-6">
                        <label class="form-label fw-bold small">Fecha Compra</label>
                        <input type="date" class="form-control shadow-sm" [(ngModel)]="assetData().purchase_date">
                    </div>
                </div>

            </div>
            <div class="modal-footer bg-white">
                <button class="btn btn-outline-secondary px-4 shadow-sm" (click)="onClose.emit()">Cancelar</button>
                <button class="btn btn-primary px-4 shadow-sm" (click)="onSave.emit()" [disabled]="!assetData().name">
                    Guardar Activo
                </button>
            </div>
        </div>
    </div>
</div>
}
