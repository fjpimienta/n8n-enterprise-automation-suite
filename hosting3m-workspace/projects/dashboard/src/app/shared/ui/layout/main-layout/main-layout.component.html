<div class="layout-wrapper">

    <div class="mobile-backdrop" [class.show]="isSidebarOpen()" (click)="isSidebarOpen.set(false)">
    </div>

    <aside class="sidebar-container" [class.open]="isSidebarOpen()">
        <app-sidebar (linkClicked)="isSidebarOpen.set(false)"></app-sidebar>
    </aside>

    <main class="main-content">
        <header class="mobile-header">
            <button (click)="toggleSidebar()">
                <i class="ti ti-menu-2"></i> </button>
            <h1 style="margin: 0; font-size: 1.1rem; font-weight: 700;">Hotel San José</h1>
        </header>

        <div class="content-container">
            <router-outlet></router-outlet>
        </div>
    </main>

    @if (showIosPrompt()) {
    <div class="position-fixed bottom-0 start-50 translate-middle-x mb-3 px-3"
        style="width: 100%; max-width: 480px; z-index: 1060;">
        <div class="card bg-primary text-primary-fg shadow-lg border-0">
            <div class="card-body p-3">
                <div class="d-flex align-items-start gap-3">
                    <div class="bg-white-10 p-2 rounded-2 text-white d-flex align-items-center justify-content-center">
                        <i class="ti ti-brand-apple fs-1"></i>
                    </div>
                    <div class="flex-fill">
                        <h4 class="card-title mb-1 fw-bold text-white">Instalar Aplicación</h4>
                        <p class="small mb-0 text-white-50">
                            Para usar esta app a pantalla completa: presiona el botón de <strong>Compartir</strong>
                            <span class="mx-1"><i class="ti ti-share fs-2 align-middle"></i></span>
                            en Safari y selecciona <strong>"Agregar a la pantalla de inicio"</strong>.
                        </p>
                    </div>
                    <button type="button" class="btn-close btn-close-white" (click)="dismissIosPrompt()"
                        aria-label="Close"></button>
                </div>
            </div>
        </div>
    </div>
    }
</div>
