# hosting3m.com: legacy redirects and static serving. PASTE MANUALLY in Plesk
# (Domains > hosting3m.com > Apache & nginx Settings > Additional nginx directives).
# Claude does not edit the server. Test on beta.hosting3m.com first.
#
# NEVER add rules for /webcard or /g: they are Sitejet asset folders that must stay untouched.

# Legacy Sitejet URLs -> new site (301)
location ~ ^/privacy/?$ { return 301 /aviso-de-privacidad; }
# Renamed legal pages. Regex locations with an optional trailing slash: an exact-match `location =` does NOT match
# "/politica-de-privacidad/", and that path exists on disk (the prerendered redirect folder), so nginx would serve its
# meta-refresh page with status 200 instead of a real 301.
location ~ ^/politica-de-privacidad/?$ { return 301 /aviso-de-privacidad; }
location ~ ^/condiciones-de-servicio/?$ { return 301 /terminos-y-condiciones; }
# /news also exists on disk as a prerendered redirect folder, so it needs the same trailing-slash-tolerant regex.
location ~ ^/news/?$ { return 301 /; }                # ASSUMPTION: confirm target
location = /noticias-elemento { return 301 /; }
location ~ ^/noticias-elemento/blog-post-[1-6]/?$ { return 301 /; }

# Builder RSS feed retired: 410 Gone
location ^~ /noticias/ { return 410; }

# Unknown paths: real 404 status with the site's "not found" page (404.html, produced by the build).
# Prerendering already writes one folder/index.html per route; we do NOT redefine "location /" because Plesk
# already owns it. REQUIREMENT: Plesk > Apache & nginx Settings > "Proxy mode" OFF, so nginx serves static files itself.
error_page 404 /404.html;
