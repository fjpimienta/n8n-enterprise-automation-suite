# Security headers for hosting3m.com and beta.hosting3m.com.
# PASTE MANUALLY in Plesk > Domains > <domain> > Apache & nginx Settings > Additional nginx directives.
# Claude does not edit the server. Paste it in the BETA domain first and watch the browser console.
#
# CSP rollout: on beta use the Report-Only line below first (nothing is blocked, violations show in the
# console). When the console is clean on every page and the form works end to end, switch to the enforcing
# line. Never keep both at once.
#
# Allowed origins and why:
#   challenges.cloudflare.com   Turnstile script and iframe
#   www.googletagmanager.com    GA4 (only loaded after the visitor accepts cookies)
#   *.google-analytics.com, *.analytics.google.com   GA4 collection (connect-src)
#   n8n.hosting3m.com           the two public endpoints (/webhook/v6/contact and /webhook/v6/news)
#   img-src https:              news images come from third-party https URLs
# The build emits no inline <script>, inline <style> or inline event handlers (checked), so no 'unsafe-inline'.

add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://challenges.cloudflare.com https://www.googletagmanager.com; style-src 'self'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://n8n.hosting3m.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# Enforcing version (replace the line above with this one after beta is clean):
# add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com https://www.googletagmanager.com; style-src 'self'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://n8n.hosting3m.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header X-Frame-Options "DENY" always;
# HSTS: enable only after production is stable on https for a while; do not add includeSubDomains
# (other subdomains such as n8n and sanjose are served by other apps). Cloudflare can also manage it.
# add_header Strict-Transport-Security "max-age=31536000" always;

# Long cache only for hashed build files (names change on every release). `expires` does not drop the
# add_header lines above, unlike a second add_header inside the location.
location ~* ^/(chunk|main|styles)-[A-Z0-9]+\.(js|css)$ {
    expires 1y;
    try_files $uri =404;
}
# Pages must always be revalidated so a new release is picked up.
location ~* \.html$ {
    expires -1;
}
