# Security headers for hosting3m.com and beta.hosting3m.com.
# PASTE MANUALLY in Plesk > Domains > <domain> > Apache & nginx Settings > Additional nginx directives.
# Claude does not edit the server. Paste it in the BETA domain first and watch the browser console.
#
# CSP rollout: on beta use the Report-Only line below first (nothing is blocked, violations show in the
# console). When the console is clean on every page and the form works end to end, switch to the enforcing
# line. Never keep both at once.
#
# Allowed origins and why:
#   challenges.cloudflare.com   Turnstile script and iframe
#   www.googletagmanager.com    GA4 (only loaded after the visitor accepts cookies)
#   *.google-analytics.com, *.analytics.google.com   GA4 collection (connect-src)
#   www.google.com              connect-src: GA4 also posts to https://www.google.com/g/collect (seen on beta, 2026-11-22;
#                               without it enforcing the CSP silently breaks Analytics). Could be narrowed to
#                               https://www.google.com/g/ after testing, but a host-only source is the safer default.
#   wa.me, github.com, linkedin.com   plain <a href> links: navigation is not governed by this CSP (no form-action/frame use)
#   fonts and images of the site        same origin ('self'); no Google Fonts, no CDN
#   Cloudflare Web Analytics beacon     NOT used by the source. If enabled in the dashboard it injects
#                               static.cloudflareinsights.com (script-src) and cloudflareinsights.com (connect-src): leave it off.
#   n8n.hosting3m.com           the two public endpoints (/webhook/v6/contact and /webhook/v6/news)
#   img-src https:              news images come from third-party https URLs
# The build emits no inline <script>, inline <style> or inline event handlers (checked), so no 'unsafe-inline'.

add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://challenges.cloudflare.com https://www.googletagmanager.com; style-src 'self'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://n8n.hosting3m.com https://www.google.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# Enforcing version (replace the line above with this one after beta is clean):
# add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com https://www.googletagmanager.com; style-src 'self'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://n8n.hosting3m.com https://www.google.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header X-Frame-Options "DENY" always;
# HSTS: enable only after production is stable on https for a while; do not add includeSubDomains
# (other subdomains such as n8n and sanjose are served by other apps). Cloudflare can also manage it.
# add_header Strict-Transport-Security "max-age=31536000" always;

# ---- Cache headers ----------------------------------------------------------------------------------
# A second add_header inside a location DROPS every add_header of the server level, so each location below
# repeats the headers it needs. Only content-hashed build files may be immutable. Fonts and images under
# /fonts and /images keep the SAME file name across releases (checked in dist: no hash), so they get a
# bounded lifetime, never `immutable`.

# 1) Content-hashed bundles (chunk-XXXX.js, main-XXXX.js, styles-XXXX.css): 1 year, immutable.
location ~* ^/(chunk|main|styles)-[A-Z0-9]+\.(js|css)$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}
# 2) Self-hosted fonts and site images (stable names): 30 days / 7 days. Cloudflare is purged at cutover (runbook 3.1).
location ~* ^/fonts/.+\.woff2$ {
    add_header Cache-Control "public, max-age=2592000" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}
location ~* ^/images/(hero|logo|profile)-[0-9]+\.webp$ {
    add_header Cache-Control "public, max-age=604800" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}
# 3) Files whose URL never changes and that crawlers/social cards fetch: revalidate (ETag/Last-Modified answer 304).
location ~* ^/(sitemap\.xml|robots\.txt|favicon\.ico|favicon-32\.png|favicon-48\.png|apple-touch-icon\.png|images/og-image\.jpg)$ {
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}
# 4) Prerendered pages: always revalidate so a release is picked up. Matches *.html and the clean URLs
#    (/, /portfolio, /aviso-de-privacidad/ ...: any path without a dot; the redirect locations of
#    nginx-legacy-redirects.conf stay exact/regex matches and win when they match first). Plesk owns `location /`; test this block on
#    beta first (curl -sI each page: 200, and /no-existe still returns the 404 page). If it changes how pages are
#    served, delete it and set the same header with a Cloudflare Transform Rule instead.
# `expires -1` sends `Cache-Control: no-cache` WITHOUT touching the inherited add_header lines, so the pages keep
# the CSP and the other security headers (do not replace it with add_header here).
location ~* \.html$ {
    expires -1;
}
location ~ ^/[^.]*$ {
    expires -1;
    try_files $uri $uri/index.html =404;
}
