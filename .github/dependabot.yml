version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/hosting3m-workspace"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "develop"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      workspace-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "rxjs"
        update-types: ["version-update:semver-major"]
      - dependency-name: "zone.js"
        update-types: ["version-update:semver-major"]
      # @angular/build 21.x peers vitest ^4; revisit when Angular supports vitest 5 (see #734).
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/workflows/06-dynamic-crud-engine/v5/tests"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "develop"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      v5-tests-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

